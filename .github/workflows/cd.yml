name: CI/CD Pipeline
on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Build Docker image
        run: docker build -t dandi0302/cd_docker_project:latest .
      - name: Log in to Docker Hub
        run: echo '${{ secrets.DOCKER_PASSWORD }}' | docker login -u '${{ secrets.DOCKER_USERNAME }}' --password-stdin
      - name: Push Docker image to Docker Hub
        run: docker push dandi0302/cd_docker_project:latest

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Deploy to Local Host
        shell: cmd
        run: |
          cd /d "D:\pracs\cicd\prac5\cd_docker_project"
          docker compose pull
          docker compose down || ver > nul
          docker compose up -d